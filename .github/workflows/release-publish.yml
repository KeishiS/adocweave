name: Release publish

on:
  workflow_call:
    inputs:
      product:
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: github-release
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2
      - name: Immutable source tree verification
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-candidate-${{ inputs.product }}*
          path: artifacts
          merge-multiple: true
      - name: Isolated candidate directory verification
        run: test -z "$(git status --porcelain --untracked-files=all | sed '\|^?? artifacts/|d')"
      - name: Immutable release input verification
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT: ${{ inputs.product }}
        run: |
          identity="$(node tools/product-release.mjs "$PRODUCT")"
          tag="$(jq -r .tag <<<"$identity")"
          build="$(jq -r .entry.build <<<"$identity")"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node tools/release-notes.mjs --check "$PRODUCT"
          if [ "$build" = cargo-dist ]; then
            tools/run-pinned-dist.sh plan --tag="$tag" --output-format=json \
              | node tools/product-release.mjs --publication-plan "$PRODUCT" > plan.json
          else
            node tools/product-release.mjs --publication-plan "$PRODUCT" > plan.json
          fi
          node tools/product-release.mjs --verify-publication "$PRODUCT" artifacts < plan.json
          node tools/release-contract.mjs "--product=$PRODUCT" "--tag=$tag"
          node tools/release-metadata.mjs verify "$PRODUCT" artifacts "$GITHUB_SHA"
          releases="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100")"
          existing="$(jq --arg tag "$tag" -r '.[][] | select(.tag_name == $tag) | .id' <<<"$releases")"
          if [ -n "$existing" ]; then
            echo "release already exists: $tag" >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "tag already exists: $tag" >&2
            exit 1
          fi
      - name: Public asset attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/*
      - name: Immutable stable tag creation
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT: ${{ inputs.product }}
        run: |
          tag_object="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$RELEASE_TAG" \
            -f message="AdocWeave $PRODUCT $RELEASE_TAG (GitHub Actions run $GITHUB_RUN_ID)" \
            -f object="$GITHUB_SHA" \
            -f type=commit)"
          tag_sha="$(jq -er .sha <<<"$tag_object")"
          echo "tag-sha=$tag_sha" >> "$GITHUB_OUTPUT"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" \
            -f sha="$tag_sha" >/dev/null
          ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
          actual_tag_sha="$(jq -er .object.sha <<<"$ref")"
          test "$actual_tag_sha" = "$tag_sha"
          actual_commit="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$actual_tag_sha" --jq .object.sha)"
          test "$actual_commit" = "$GITHUB_SHA"
      - name: Private draft creation and verification
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT: ${{ inputs.product }}
        run: |
          tag="$(jq -r '.announcement_tag' plan.json)"
          title="$(jq -r '.title' plan.json)"
          body="$(node tools/release-notes.mjs "$PRODUCT" "$tag" </dev/null)"
          marker="<!-- adocweave-release-run:${GITHUB_RUN_ID} -->"
          draft_body="$(printf '%s\n\n%s\n' "$body" "$marker")"
          draft="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$tag" \
            -f name="$title" \
            -f body="$draft_body" \
            -F draft=true \
            -F prerelease=false)"
          release_id="$(jq -r '.id' <<<"$draft")"
          upload_url="$(jq -r '.upload_url' <<<"$draft")"
          upload_url="${upload_url%%\{*}"
          test "$release_id" != null
          test -n "$upload_url"
          echo "release-id=$release_id" >> "$GITHUB_OUTPUT"
          for file in artifacts/*; do
            name="${file##*/}"
            gh api --method POST \
              --header 'Content-Type: application/octet-stream' \
              --input "$file" \
              "$upload_url?name=$name" >/dev/null
          done
          draft="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id")"
          expected="$(find artifacts -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          actual="$(jq -r '.assets[].name' <<<"$draft" | LC_ALL=C sort)"
          if [ "$actual" != "$expected" ]; then
            echo "draft release asset set mismatch" >&2
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")
            exit 1
          fi
          while IFS= read -r file; do
            name="${file##*/}"
            expected_size="$(stat --format=%s "$file")"
            actual_size="$(jq --arg name "$name" -er '.assets[] | select(.name == $name) | .size' <<<"$draft")"
            test "$actual_size" = "$expected_size"
          done < <(find artifacts -maxdepth 1 -type f | LC_ALL=C sort)
      - name: Complete release publication
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT: ${{ inputs.product }}
          RELEASE_ID: ${{ steps.draft.outputs.release-id }}
        run: |
          body="$(node tools/release-notes.mjs "$PRODUCT" "$RELEASE_TAG" </dev/null)"
          result="$(gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -f body="$body" -F draft=false)"
          test "$(jq -r '.draft' <<<"$result")" = false
          test "$(jq -r '.tag_name' <<<"$result")" = "$RELEASE_TAG"
          expected="$(find artifacts -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          actual="$(jq -r '.assets[].name' <<<"$result" | LC_ALL=C sort)"
          test "$actual" = "$expected"
      - name: Incomplete draft removal
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          marker="<!-- adocweave-release-run:${GITHUB_RUN_ID} -->"
          releases="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100")"
          draft="$(jq --arg tag "$RELEASE_TAG" -c \
            '[.[][] | select(.tag_name == $tag)] | if length == 0 then null elif length == 1 then .[0] else error("duplicate release tag") end' \
            <<<"$releases")"
          if [ "$draft" = null ]; then
            exit 0
          fi
          test "$(jq -r .draft <<<"$draft")" = true
          jq -e --arg marker "$marker" '.body | contains($marker)' <<<"$draft" >/dev/null
          release_id="$(jq -er .id <<<"$draft")"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"
      - name: Incomplete stable tag removal
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT: ${{ inputs.product }}
          RELEASE_TAG_SHA: ${{ steps.tag.outputs.tag-sha }}
        run: |
          releases="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100")"
          existing="$(jq --arg tag "$RELEASE_TAG" -r '.[][] | select(.tag_name == $tag) | .id' <<<"$releases")"
          if [ -n "$existing" ]; then
            echo "a release still refers to $RELEASE_TAG; tag cleanup is not attempted" >&2
            exit 1
          fi
          refs="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/git/matching-refs/tags")"
          actual="$(jq --arg ref "refs/tags/$RELEASE_TAG" -r \
            '[.[][] | select(.ref == $ref) | .object.sha] | if length == 0 then "" elif length == 1 then .[0] else error("duplicate tag ref") end' \
            <<<"$refs")"
          if [ -z "$actual" ]; then
            exit 0
          fi
          expected="$RELEASE_TAG_SHA"
          if [ -z "$expected" ]; then
            tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$actual")"
            expected_message="AdocWeave $PRODUCT $RELEASE_TAG (GitHub Actions run $GITHUB_RUN_ID)"
            test "$(jq -r .message <<<"$tag_object")" = "$expected_message"
            test "$(jq -r .object.sha <<<"$tag_object")" = "$GITHUB_SHA"
            expected="$actual"
          fi
          if [ "$actual" != "$expected" ]; then
            echo "tag ref changed after this run created it; cleanup is not attempted" >&2
            exit 1
          fi
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG"

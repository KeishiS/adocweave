name: Visual Studio Marketplace publication

# 公開済みGitHub ReleaseのVSIXをVisual Studio Marketplaceへ公開する。成果物は作り直さず、
# Releaseのassetをdownloadしてchecksumとattestationを検証してから送信する。
#
# 認証はMicrosoft Entra IDのworkload identity federationを使う。長期tokenを持たず、
# GitHub ActionsのOIDCで公開元を確認する。Azure DevOpsのglobal Personal Access Tokenは
# 2026-12-01に廃止されるため使わない。federated credentialのsubjectはenvironment
# marketplace-publishで、branchやtagを対象にしない。main上で動くほかのworkflowが
# 同じtokenを要求できないようにするため。
#
# stable releaseの公開workflowから呼び出すほか、tagを指定して単独で実行できる。
# Marketplaceへの送信だけが失敗した場合、GitHub Releaseは公開済みで作り直せないため、
# このworkflowを同じtagで実行して回復する。同じversionの再公開はMarketplaceが拒否するため、
# 公開済みの版を上書きしない。
#
# tagを空にして実行すると、送信を行わず公開用identityだけを報告する。publisherのMembersへ
# 登録するIDはAzure DevOpsが持つprofileのIDで、Entraのclient IDでもobject IDでもない。
# このIDはidentity自身が認証しないと取得できず、手元から取得するにはclient secretが必要に
# なるため、この経路で取得する。identityを入れ替えたときにも同じ手順で取り直す。

on:
  workflow_call:
    inputs:
      tag:
        description: Published stable tag whose VSIX is sent to the Marketplace
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable tag whose VSIX is sent to the Marketplace. Leave empty to report the publishing identity without sending anything.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: marketplace-publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: marketplace-publish
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      # 公開用の資格情報は、送る成果物を検証したあとに取得する。
      - name: Published VSIX download and verification
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test -n "$RELEASE_TAG"
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          test "$(jq -r .tag_name <<<"$release")" = "$RELEASE_TAG"
          test "$(jq -r .draft <<<"$release")" = false
          test "$(jq -r .prerelease <<<"$release")" = false
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"

          workspace_version="$(sed -n '/^\[workspace\.package\]/,/^\[/ s/^version = "\([^"]*\)"/\1/p' Cargo.toml)"
          [[ "$workspace_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$RELEASE_TAG" = "v$workspace_version"
          test "$(jq -er .version editors/vscode/package.json)" = "$workspace_version"

          mkdir -p marketplace
          asset="adocweave-vscode-$workspace_version.vsix"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir marketplace \
            --pattern sha256.sum --pattern "$asset"
          vsix="marketplace/$asset"
          test -f "$vsix"
          (cd marketplace && grep -F "$(basename "$vsix")" sha256.sum | sha256sum --check --strict -)
          vsix_manifest="$(unzip -p "$vsix" extension/package.json)"
          test "$(jq -er .name <<<"$vsix_manifest")" = "$(jq -er .name editors/vscode/package.json)"
          test "$(jq -er .version <<<"$vsix_manifest")" = "$workspace_version"
          gh attestation verify "$vsix" --repo "$GITHUB_REPOSITORY"
          gh attestation verify marketplace/sha256.sum --repo "$GITHUB_REPOSITORY"
          # publish stepはeditors/vscodeで実行するため、相対pathでは届かない。
          echo "vsix=$(realpath "$vsix")" >> "$GITHUB_ENV"
      - uses: Azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          # このidentityはAzureのsubscriptionを持たず、Marketplaceへ送信するだけ。
          allow-no-subscriptions: true
      - name: Publishing identity report
        run: |
          # 499b84ac-1321-427f-aa17-267ca6975798 はAzure DevOpsのresource IDで、
          # tenantによらない固定値。profileはこの呼び出しで作成または取得される。
          az rest --method get --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --url https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --output json > profile.json
          echo "Azure DevOps profile id: $(jq -er .id profile.json)"
          echo "publisher adocweaveのMembersへContributorとして登録するIDです。"
      - name: Resolve the pinned Node.js version
        if: inputs.tag != ''
        id: node-version
        run: echo "value=$(jq -er .nodeVersion toolchains.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: inputs.tag != ''
        with:
          node-version: ${{ steps.node-version.outputs.value }}
      - name: Visual Studio Marketplace publication
        if: inputs.tag != ''
        working-directory: editors/vscode
        run: |
          npm ci
          # --packagePath は検証済みのVSIXをそのまま送る。packageし直さないため、
          # Open VSXとMarketplaceへ同じbyte列が届く。
          npx --no-install vsce publish --packagePath "$vsix" --azure-credential
          echo "Published $(basename "$vsix") to the Visual Studio Marketplace"

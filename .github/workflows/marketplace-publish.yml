name: Visual Studio Marketplace publication

# 公開済みGitHub ReleaseのVSIXをVisual Studio Marketplaceへ公開する。成果物は作り直さず、
# Releaseのassetをdownloadしてchecksumとattestationを検証してから送信する。
#
# 認証はMarketplaceのTrusted PublisherとvsceのOIDC経路を使う。長期token、Azure login、
# Entra ID用変数は持たない。Trusted Publisherにはこのrepository、呼出し元workflow fileの
# release.ymlおよびmarketplace-publish environmentを登録する。再利用workflowを呼び出したOIDCの
# workflow identityは呼出し元のrelease.ymlになる。
#
# 同じversionが既に存在する場合は、Marketplaceから取得したVSIXをReleaseのVSIXと照合して
# 送信せずに完了する。Marketplaceが追加する署名領域はbyte一致の対象外とするが、拡張ID、
# version、targetおよび署名以外のfile一覧と内容は一致を必須とする。

on:
  workflow_call:
    inputs:
      tag:
        description: Published stable tag whose VSIX is sent to the Marketplace
        required: true
        type: string
      commit:
        description: Complete commit SHA for the published stable tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: marketplace-publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: marketplace-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Resolve the pinned Node.js version
        id: node-version
        run: echo "value=$(jq -er .nodeVersion toolchains.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.node-version.outputs.value }}
      - name: Published VSIX download and verification
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          test -n "$RELEASE_TAG"
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          test "$(jq -r .tag_name <<<"$release")" = "$RELEASE_TAG"
          test "$(jq -r .draft <<<"$release")" = false
          test "$(jq -r .prerelease <<<"$release")" = false
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"

          workspace_version="$(sed -n '/^\[workspace\.package\]/,/^\[/ s/^version = "\([^"]*\)"/\1/p' Cargo.toml)"
          [[ "$workspace_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$RELEASE_TAG" = "v$workspace_version"
          test "$(jq -er .version editors/vscode/package.json)" = "$workspace_version"

          mkdir -p marketplace
          asset="adocweave-vscode-$workspace_version.vsix"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir marketplace \
            --pattern sha256.sum --pattern "$asset"
          vsix="$(realpath "marketplace/$asset")"
          test -f "$vsix"
          (cd marketplace && grep -F "$(basename "$vsix")" sha256.sum | sha256sum --check --strict -)
          vsix_manifest="$(unzip -p "$vsix" extension/package.json)"
          test "$(jq -er .name <<<"$vsix_manifest")" = "$(jq -er .name editors/vscode/package.json)"
          test "$(jq -er .publisher <<<"$vsix_manifest")" = "$(jq -er .publisher editors/vscode/package.json)"
          test "$(jq -er .version <<<"$vsix_manifest")" = "$workspace_version"
          gh attestation verify "$vsix" --repo "$GITHUB_REPOSITORY"
          gh attestation verify marketplace/sha256.sum --repo "$GITHUB_REPOSITORY"
          echo "vsix=$vsix" >> "$GITHUB_ENV"
      - name: Install the pinned publication tool
        working-directory: editors/vscode
        run: npm ci
      - name: Existing Marketplace publication verification
        id: registry
        working-directory: editors/vscode
        run: |
          state="$(node scripts/marketplace-publication.mts \
            --candidate "$vsix" --publisher adocweave --name adocweave-vscode \
            --version "$(jq -er .version package.json)" --target universal)"
          case "$state" in
            missing|pending|published) echo "state=$state" >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac
      - name: Visual Studio Marketplace publication
        if: steps.registry.outputs.state == 'missing'
        working-directory: editors/vscode
        run: |
          npx --no-install vsce publish --packagePath "$vsix" --oidc
          echo "Sent $(basename "$vsix") to the Visual Studio Marketplace"
      - name: Published Marketplace extension verification
        working-directory: editors/vscode
        run: |
          version="$(jq -er .version package.json)"
          for _attempt in {1..12}; do
            state="$(node scripts/marketplace-publication.mts \
              --candidate "$vsix" --publisher adocweave --name adocweave-vscode \
              --version "$version" --target universal)"
            if [ "$state" = published ]; then
              echo "Published and verified adocweave.adocweave-vscode $version on the Visual Studio Marketplace"
              exit 0
            fi
            [ "$state" = missing ] || [ "$state" = pending ]
            sleep 5
          done
          echo "Marketplace did not make adocweave.adocweave-vscode $version available within 60 seconds" >&2
          exit 1

name: Binary cache publication

# 公開済みReleaseと同じcommitからNix package closureを構築し、Cachixへ送信する。
# 送信後は別のrunnerでローカルでの構築を禁止し、Cachixから取得したpackageを検査する。
# Nix store pathは内容から決まるため、同じtagを指定した再実行でも既存の内容を変更しない。
on:
  workflow_call:
    inputs:
      tag:
        description: Published stable tag
        required: true
        type: string
      commit:
        description: Complete commit SHA for the published stable tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: binary-cache-publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    environment: binary-cache-publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            nixSystem: x86_64-linux
          - runner: ubuntu-24.04-arm
            nixSystem: aarch64-linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Published release verification
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          test "$(jq -r .tag_name <<<"$release")" = "$RELEASE_TAG"
          test "$(jq -r .draft <<<"$release")" = false
          test "$(jq -r .prerelease <<<"$release")" = false
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"

          workspace_version="$(sed -n '/^\[workspace\.package\]/,/^\[/ s/^version = "\([^"]*\)"/\1/p' Cargo.toml)"
          [[ "$workspace_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$RELEASE_TAG" = "v$workspace_version"
      - uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: keishis
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
      - name: Release package closure build and push
        env:
          NIX_SYSTEM: ${{ matrix.nixSystem }}
        run: |
          check="$(nix build ".#checks.${NIX_SYSTEM}.default" --no-link --print-out-paths)"
          package="$(readlink -f "$check/package")"
          test -n "$package"
          cachix push keishis "$package"

  verify:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            nixSystem: x86_64-linux
          - runner: ubuntu-24.04-arm
            nixSystem: aarch64-linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Verified commit check
        env:
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
      - uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: keishis
          skipPush: true
      - name: Cache-only package acquisition and smoke
        env:
          NIX_SYSTEM: ${{ matrix.nixSystem }}
        run: |
          package="$(nix build ".#packages.${NIX_SYSTEM}.default" \
            --no-link --print-out-paths \
            --option builders '' \
            --option fallback false \
            --option max-jobs 0 \
            --option substituters https://keishis.cachix.org)"
          test -n "$package"
          node tools/binary-cache-smoke.mjs "$package/bin/adocweave"

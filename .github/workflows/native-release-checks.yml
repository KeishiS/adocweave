name: Native release checks

on:
  workflow_call:
    inputs:
      release_tag:
        description: Stable release tag to validate
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2
      - name: Native version, tag, and cargo-dist plan
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: nix develop .#ci -c cargo make native-release-checks

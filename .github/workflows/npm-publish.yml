name: npm publication

# 公開済みGitHub Releaseのpackage archiveをnpm Registryへ公開する。成果物は作り直さず、
# Releaseのassetをdownloadしてchecksumとattestationを検証してから送信する。
#
# 認証はnpmのTrusted Publishingを使う。長期tokenを持たず、GitHub ActionsのOIDCで公開元を
# 確認する。provenanceはTrusted Publishing経由の公開へ自動で付くため、明示の指定はしない。
# Trusted Publisherはpackage単位の設定で、packageが実在しないと登録できない。したがって
# 初回公開だけは、公開済みReleaseのarchiveを手元からnpmへ送る。手順はコントリビューション
# ガイドを参照する。
#
# stable releaseの公開workflowから呼び出すほか、tagを指定して単独で実行できる。
# 二つのpackageは固定したmatrixで処理する。npmへの送信だけが失敗した場合は、このworkflowを
# 同じtagで実行して回復する。同じversionが既に存在する場合はRegistryのintegrityを確認し、
# Releaseのarchiveと同じであれば送信せずに完了する。

on:
  workflow_call:
    inputs:
      tag:
        description: Published stable tag whose package archive is sent to npm
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable tag whose package archive is sent to npm
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        package:
          - textlint
          - wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      # このjobはnpmを実行するだけで、Rust toolchainもHTML validatorも使わない。
      # CI用Nix環境はそれらを含むため、release manifestのversionをsetup-nodeへ渡す。
      - name: Resolve the pinned Node.js version
        id: node-version
        run: echo "value=$(jq -er .nodeVersion toolchains.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.node-version.outputs.value }}
      - name: Release package download and verification
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_PACKAGE: ${{ matrix.package }}
        run: |
          test -n "$RELEASE_TAG"
          test -n "$RELEASE_PACKAGE"
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          test "$(jq -r .tag_name <<<"$release")" = "$RELEASE_TAG"
          test "$(jq -r .draft <<<"$release")" = false
          test "$(jq -r .prerelease <<<"$release")" = false
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"

          workspace_version="$(sed -n '/^\[workspace\.package\]/,/^\[/ s/^version = "\([^"]*\)"/\1/p' Cargo.toml)"
          [[ "$workspace_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$RELEASE_TAG" = "v$workspace_version"
          case "$RELEASE_PACKAGE" in
            textlint)
              package_manifest=packages/textlint-plugin-asciidoc/package.json
              asset="adocweave-textlint-plugin-asciidoc-$workspace_version.tgz"
              ;;
            wasm)
              package_manifest=web-worker/package.json
              asset="adocweave-wasm-$workspace_version.tgz"
              ;;
            *)
              echo "$RELEASE_PACKAGEの公開には対応していません" >&2
              exit 1
              ;;
          esac
          test "$(jq -er .version "$package_manifest")" = "$workspace_version"

          mkdir -p npm-candidate
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir npm-candidate \
            --pattern sha256.sum --pattern "$asset"
          # 復旧では過去のtagを指定するため、checkoutしたtoolはこのworkflowより古い
          # ことがある。公開そのものの手順はtoolのversionに依存させない。npmは
          # ``foo/bar.tgz``をGitHubの``owner/repo``短縮記法として解釈するため、
          # 成果物は絶対pathで渡す。
          tarball="$(realpath "npm-candidate/$asset")"
          test -f "$tarball"
          (cd npm-candidate && grep -F "$(basename "$tarball")" sha256.sum | sha256sum --check --strict -)
          archive_manifest="$(tar -xzOf "$tarball" package/package.json)"
          test "$(jq -er .name <<<"$archive_manifest")" = "$(jq -er .name "$package_manifest")"
          test "$(jq -er .version <<<"$archive_manifest")" = "$workspace_version"
          gh attestation verify "$tarball" --repo "$GITHUB_REPOSITORY"
          gh attestation verify npm-candidate/sha256.sum --repo "$GITHUB_REPOSITORY"
          echo "tarball=$tarball" >> "$GITHUB_ENV"
          echo "name=$(jq -er .name <<<"$archive_manifest")" >> "$GITHUB_OUTPUT"
          echo "version=$workspace_version" >> "$GITHUB_OUTPUT"
      - name: Existing npm publication verification
        id: registry
        env:
          PACKAGE_NAME: ${{ steps.candidate.outputs.name }}
          PACKAGE_VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          state="$(node tools/npm-publication.mjs \
            --candidate "$tarball" --name "$PACKAGE_NAME" --version "$PACKAGE_VERSION")"
          case "$state" in
            missing|published) echo "state=$state" >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac
      - name: npm publication
        if: steps.registry.outputs.state == 'missing'
        run: |
          # Trusted Publishingはid-token以外の資格情報を使わない代わりに、対応する
          # npmを必要とする。満たさない場合は分かりにくい認証失敗として現れるため、
          # 原因を示してここで止める。
          minimum=11.5.1
          actual="$(npm --version)"
          if [ "$(printf '%s\n%s\n' "$minimum" "$actual" | sort -V | head -n1)" != "$minimum" ]; then
            echo "Trusted Publishingにはnpm $minimum以上が必要です: $actual" >&2
            exit 1
          fi
          npm publish "$tarball"
      - name: Published npm package verification
        env:
          PACKAGE_NAME: ${{ steps.candidate.outputs.name }}
          PACKAGE_VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          for _attempt in {1..12}; do
            state="$(node tools/npm-publication.mjs \
              --candidate "$tarball" --name "$PACKAGE_NAME" --version "$PACKAGE_VERSION")"
            if [ "$state" = published ]; then
              echo "Published and verified $PACKAGE_NAME $PACKAGE_VERSION on npm"
              exit 0
            fi
            test "$state" = missing
            sleep 5
          done
          echo "npm did not make $PACKAGE_NAME $PACKAGE_VERSION available within 60 seconds" >&2
          exit 1
      # 公開そのものは終わっているため、ここから先の失敗はRelease、tagおよびnpm上の
      # packageを変えない。公開後の観測は、そのversionを定義したtag時点のtoolで行う。
      - name: Published package smoke from the npm Registry
        env:
          RELEASE_PACKAGE: ${{ matrix.package }}
        run: |
          case "$RELEASE_PACKAGE" in
            textlint) node tools/textlint-plugin-npm-smoke.mjs ;;
            wasm) node tools/wasm-npm-smoke.mjs ;;
            *)
              echo "$RELEASE_PACKAGEの公開後smokeがありません" >&2
              exit 1
              ;;
          esac

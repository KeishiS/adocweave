name: npm publication

# 公開済みGitHub Releaseのpackage archiveをnpm Registryへ公開する。成果物は作り直さず、
# Releaseのassetをdownloadしてchecksumとattestationを検証してから送信する。
#
# 認証はnpmのTrusted Publishingを使う。長期tokenを持たず、GitHub ActionsのOIDCで公開元を
# 確認する。provenanceはTrusted Publishing経由の公開へ自動で付くため、明示の指定はしない。
# Trusted Publisherはpackage単位の設定で、packageが実在しないと登録できない。したがって
# 初回公開だけは、公開済みReleaseのarchiveを手元からnpmへ送る。手順はコントリビューション
# ガイドを参照する。
#
# stable releaseの公開workflowから呼び出すほか、tagと製品を指定して単独で実行できる。
# npmへの送信だけが失敗した場合、GitHub Releaseは公開済みで作り直せないため、このworkflowを
# 同じtagで実行して回復する。同じversionの再公開はnpmが拒否するため、公開済みの版を
# 上書きしない。

on:
  workflow_call:
    inputs:
      tag:
        description: Published stable tag whose package archive is sent to npm
        required: true
        type: string
      product:
        description: Release product whose npm package is published
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable tag whose package archive is sent to npm
        required: true
        type: string
      product:
        description: Release product whose npm package is published
        required: true
        type: choice
        options:
          - textlint

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      # このjobはnpmを実行するだけで、Rust toolchainもHTML validatorも使わない。
      # CI用Nix環境はそれらを含むため、release manifestのversionをsetup-nodeへ渡す。
      - name: Resolve the pinned Node.js version
        id: node-version
        run: echo "value=$(jq -er .nodeVersion toolchains.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.node-version.outputs.value }}
      - name: Published package download and verification
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_PRODUCT: ${{ inputs.product }}
        run: |
          test -n "$RELEASE_TAG"
          test -n "$RELEASE_PRODUCT"
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          test "$(jq -r .tag_name <<<"$release")" = "$RELEASE_TAG"
          test "$(jq -r .draft <<<"$release")" = false
          test "$(jq -r .prerelease <<<"$release")" = false
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          mkdir -p npm-candidate
          node tools/release-contract.mjs "--product=$RELEASE_PRODUCT" "--tag=$RELEASE_TAG"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir npm-candidate
          node tools/product-release.mjs --verify-candidate "$RELEASE_PRODUCT" npm-candidate
          node tools/release-metadata.mjs verify "$RELEASE_PRODUCT" npm-candidate "$(git rev-parse HEAD)"
          tarball="$(node tools/npm-package-asset.mjs resolve "$RELEASE_PRODUCT" npm-candidate)"
          (cd npm-candidate && grep -F "$(basename "$tarball")" sha256.sum | sha256sum --check --strict -)
          for file in npm-candidate/*; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY"
          done
          echo "tarball=$tarball" >> "$GITHUB_ENV"
      - name: npm publication
        env:
          RELEASE_PRODUCT: ${{ inputs.product }}
        run: |
          # Trusted Publishingはid-token以外の資格情報を使わない代わりに、
          # 対応するnpmを必要とする。満たさない場合はここで止める。
          node tools/npm-package-asset.mjs --require-trusted-publishing "$(npm --version)"
          npm publish "$tarball"
          node tools/npm-package-asset.mjs verify-published "$RELEASE_PRODUCT" npm-candidate

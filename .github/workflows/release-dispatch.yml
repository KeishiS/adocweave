name: Stable release

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact main tip commit to publish as the stable release
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  readiness:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      candidate_sha: ${{ steps.readiness.outputs.candidate_sha }}
      candidate_run_id: ${{ steps.readiness.outputs.run_id }}
      tag: ${{ steps.readiness.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - id: readiness
        name: Release candidate resolution
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: node tools/release-readiness.mjs

  plan:
    needs: [readiness]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      manifest: ${{ steps.plan.outputs.manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.readiness.outputs.candidate_sha }}
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
      - id: plan
        env:
          CANDIDATE_TAG: ${{ needs.readiness.outputs.tag }}
        run: |
          tools/run-pinned-dist.sh plan --tag="$CANDIDATE_TAG" --output-format=json > plan.json
          echo "manifest=$(jq -c . plan.json)" >> "$GITHUB_OUTPUT"

  reuse-candidate:
    needs: [readiness, plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.readiness.outputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-candidate
          path: artifacts
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.readiness.outputs.candidate_run_id }}
      - name: Reused candidate verification
        env:
          CANDIDATE_SHA: ${{ needs.readiness.outputs.candidate_sha }}
        run: node tools/release-metadata.mjs verify artifacts "$CANDIDATE_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-candidate
          if-no-files-found: error
          retention-days: 1
          path: artifacts/*

  publish:
    needs: [readiness, plan, reuse-candidate]
    uses: ./.github/workflows/release-publish.yml
    with:
      candidate_sha: ${{ needs.readiness.outputs.candidate_sha }}
      plan: ${{ needs.plan.outputs.manifest }}
      tag: ${{ needs.readiness.outputs.tag }}
    permissions:
      attestations: write
      contents: write
      id-token: write

  textlint-plugin-post-release-smoke:
    needs: [readiness, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.readiness.outputs.candidate_sha }}
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
      - name: Published textlint asset, checksum, and one-shot npx observation
        run: nix develop .#ci -c cargo make textlint-plugin-post-release-npx-smoke

  # Stable releaseの公開が成功したら、公開済みのVSIXをOpen VSX Registryへ公開する。
  # 成果物は作り直さず、GitHub Releaseのassetをdownloadしてchecksumとattestationを検証してから
  # 送信する。Open VSXのAPIはOIDCへ対応しないため、このjobだけがrepository secretの
  # publish token(OPEN_VSX_TOKEN)を参照する。publishに失敗してもtagとGitHub Releaseへは
  # 影響しないため、同じrunのこのjobを再実行して回復する。同じversionの再公開はOpen VSXが
  # 拒否するため、公開済みの版を上書きしない。
  open-vsx:
    needs: [readiness, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.readiness.outputs.candidate_sha }}
          persist-credentials: false
      - name: Published VSIX download and verification
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.readiness.outputs.tag }}
        run: |
          mkdir -p open-vsx
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'adocweave-vscode-*.vsix' --pattern sha256.sum --dir open-vsx
          vsix="$(ls open-vsx/adocweave-vscode-*.vsix)"
          (cd open-vsx && grep -F "$(basename "$vsix")" sha256.sum | sha256sum --check --strict -)
          gh attestation verify "$vsix" --repo "$GITHUB_REPOSITORY"
          echo "vsix=$vsix" >> "$GITHUB_ENV"
      - name: Open VSX publication
        env:
          OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
        run: |
          curl --silent --show-error --fail-with-body --max-time 120 \
            --get --data-urlencode "token=$OPEN_VSX_TOKEN" \
            --output verify-pat.json --write-out '%{http_code}\n' \
            https://open-vsx.org/api/adocweave/verify-pat
          curl --silent --show-error --fail-with-body --max-time 300 \
            --request POST --header 'Content-Type: application/octet-stream' \
            --get --data-urlencode "token=$OPEN_VSX_TOKEN" \
            --data-binary "@$vsix" --output published.json \
            https://open-vsx.org/api/-/publish
          jq -e '.namespace == "adocweave" and .name == "adocweave-vscode"' published.json

  # Stable releaseの公開が成功したら、同じcandidate SHAのNixパッケージのruntime closureを
  # binary cache(keishis.cachix.org)へpushする。利用側はsubstituterを設定するだけで、
  # AdocWeaveをsource buildせずに取得できる。push対象はstable releaseだけに限り、
  # pull requestやmainへのpushではcacheの書き込みtokenを参照しない。
  binary-cache:
    needs: [readiness, publish]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            nixSystem: x86_64-linux
          - runner: ubuntu-24.04-arm
            nixSystem: aarch64-linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.readiness.outputs.candidate_sha }}
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: keishis
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
      - name: Release package closure build and push
        env:
          NIX_SYSTEM: ${{ matrix.nixSystem }}
        run: |
          package="$(nix build ".#packages.${NIX_SYSTEM}.default" --no-link --print-out-paths)"
          test -n "$package"
          cachix push keishis "$package"

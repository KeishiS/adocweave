name: Stable release

on:
  workflow_dispatch:
    inputs:
      product:
        description: Product to publish from the selected candidate
        required: true
        type: choice
        options:
          - cli
          - lsp
          - browser
          - textlint
          - vscode
          - zed
      candidate_sha:
        description: Exact main tip commit to publish as the stable release
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: stable-release-${{ inputs.product }}
  cancel-in-progress: false

jobs:
  readiness:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      candidate_artifact: ${{ steps.readiness.outputs.candidate_artifact }}
      candidate_sha: ${{ steps.readiness.outputs.candidate_sha }}
      candidate_run_id: ${{ steps.readiness.outputs.run_id }}
      product: ${{ steps.readiness.outputs.product }}
      tag: ${{ steps.readiness.outputs.tag }}
      version: ${{ steps.readiness.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - id: readiness
        name: Release candidate resolution
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: node tools/release-readiness.mjs "${{ inputs.product }}"

  plan:
    needs: [readiness]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      manifest: ${{ steps.plan.outputs.manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.readiness.outputs.candidate_sha }}
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
      - id: plan
        env:
          CANDIDATE_TAG: ${{ needs.readiness.outputs.tag }}
          PRODUCT: ${{ needs.readiness.outputs.product }}
        run: |
          build="$(node tools/product-release.mjs "$PRODUCT" | jq -r .entry.build)"
          if [ "$build" = cargo-dist ]; then
            tools/run-pinned-dist.sh plan --tag="$CANDIDATE_TAG" --output-format=json \
              | node tools/product-release.mjs --publication-plan "$PRODUCT" > plan.json
          else
            node tools/product-release.mjs --publication-plan "$PRODUCT" > plan.json
          fi
          echo "manifest=$(jq -c . plan.json)" >> "$GITHUB_OUTPUT"

  reuse-candidate:
    needs: [readiness, plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.readiness.outputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.readiness.outputs.candidate_artifact }}
          path: artifacts
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.readiness.outputs.candidate_run_id }}
      - name: Reused candidate verification
        env:
          CANDIDATE_SHA: ${{ needs.readiness.outputs.candidate_sha }}
          PRODUCT: ${{ needs.readiness.outputs.product }}
        run: |
          node tools/product-release.mjs --verify-candidate "$PRODUCT" artifacts
          node tools/release-metadata.mjs verify artifacts "$CANDIDATE_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ needs.readiness.outputs.candidate_artifact }}
          if-no-files-found: error
          retention-days: 1
          path: artifacts/*

  publish:
    needs: [readiness, plan, reuse-candidate]
    uses: ./.github/workflows/release-publish.yml
    with:
      candidate_sha: ${{ needs.readiness.outputs.candidate_sha }}
      plan: ${{ needs.plan.outputs.manifest }}
      product: ${{ needs.readiness.outputs.product }}
      tag: ${{ needs.readiness.outputs.tag }}
    permissions:
      attestations: write
      contents: write
      id-token: write

  textlint-plugin-post-release-smoke:
    if: needs.readiness.outputs.product == 'textlint'
    needs: [readiness, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.readiness.outputs.candidate_sha }}
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
      - name: Published textlint asset, checksum, and one-shot npx observation
        run: nix develop .#ci -c cargo make textlint-plugin-post-release-npx-smoke

  # Stable releaseの公開が成功したら、公開済みのVSIXをOpen VSX Registryへ公開する。
  # 送信だけが失敗した場合はopen-vsx-publish.ymlを同じtagで実行して回復する。
  open-vsx:
    if: needs.readiness.outputs.product == 'vscode'
    needs: [readiness, publish]
    uses: ./.github/workflows/open-vsx-publish.yml
    with:
      tag: ${{ needs.readiness.outputs.tag }}
    secrets: inherit

  # Stable releaseの公開が成功したら、同じcandidate SHAのNixパッケージのruntime closureを
  # binary cache(keishis.cachix.org)へpushする。利用側はsubstituterを設定するだけで、
  # AdocWeaveをsource buildせずに取得できる。push対象はstable releaseだけに限り、
  # pull requestやmainへのpushではcacheの書き込みtokenを参照しない。
  binary-cache:
    if: needs.readiness.outputs.product == 'cli'
    needs: [readiness, publish]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            nixSystem: x86_64-linux
          - runner: ubuntu-24.04-arm
            nixSystem: aarch64-linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.readiness.outputs.candidate_sha }}
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: keishis
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
      - name: Release package closure build and push
        env:
          NIX_SYSTEM: ${{ matrix.nixSystem }}
        run: |
          package="$(nix build ".#packages.${NIX_SYSTEM}.default" --no-link --print-out-paths)"
          test -n "$package"
          cachix push keishis "$package"

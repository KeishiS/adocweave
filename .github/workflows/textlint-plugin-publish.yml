name: textlint plugin package publication

# @adocweave/textlint-plugin-asciidoc is built, verified, and published from
# its own stable tag. npm Trusted Publishing verifies this workflow through
# OIDC and adds provenance automatically. No GitHub Release or npm token is
# used.
on:
  push:
    tags:
      - 'textlint-plugin-asciidoc/v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: textlint-plugin-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      archive: ${{ steps.identity.outputs.archive }}
      name: ${{ steps.identity.outputs.name }}
      sha256: ${{ steps.candidate.outputs.sha256 }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Package tag and source verification
        id: identity
        env:
          PACKAGE_TAG: ${{ github.ref_name }}
          PACKAGE_COMMIT: ${{ github.sha }}
        run: |
          [[ "$PACKAGE_TAG" =~ ^textlint-plugin-asciidoc/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          version="$(jq -er .version packages/textlint-plugin-asciidoc/package.json)"
          name="$(jq -er .name packages/textlint-plugin-asciidoc/package.json)"
          test "$name" = "@adocweave/textlint-plugin-asciidoc"
          test "$PACKAGE_TAG" = "textlint-plugin-asciidoc/v$version"
          test "$(git rev-parse "refs/tags/$PACKAGE_TAG^{commit}")" = "$PACKAGE_COMMIT"
          test "$(git rev-parse HEAD)" = "$PACKAGE_COMMIT"
          git merge-base --is-ancestor "$PACKAGE_COMMIT" refs/remotes/origin/main
          echo "archive=adocweave-textlint-plugin-asciidoc-$version.tgz" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2
      - name: Package build and verification
        run: nix develop .#ci-browser -c cargo make test-textlint-plugin-release-candidate
      - name: Candidate identity
        id: candidate
        env:
          PACKAGE_ARCHIVE: ${{ steps.identity.outputs.archive }}
        run: |
          archive="target/distrib/$PACKAGE_ARCHIVE"
          test -f "$archive"
          echo "sha256=$(sha256sum "$archive" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: textlint-plugin-package-${{ steps.identity.outputs.version }}
          path: target/distrib/${{ steps.identity.outputs.archive }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      PACKAGE_ARCHIVE: ${{ needs.candidate.outputs.archive }}
      PACKAGE_NAME: ${{ needs.candidate.outputs.name }}
      PACKAGE_VERSION: ${{ needs.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve the pinned Node.js version
        id: node-version
        run: echo "value=$(jq -er .nodeVersion toolchains.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.node-version.outputs.value }}
      - uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v8.0.0
        with:
          name: textlint-plugin-package-${{ needs.candidate.outputs.version }}
          path: target/distrib
      - name: Candidate verification
        run: |
          tarball="$(realpath "target/distrib/$PACKAGE_ARCHIVE")"
          test "$(sha256sum "$tarball" | cut -d ' ' -f 1)" = "${{ needs.candidate.outputs.sha256 }}"
          manifest="$(tar -xzOf "$tarball" package/package.json)"
          test "$(jq -er .name <<<"$manifest")" = "$PACKAGE_NAME"
          test "$(jq -er .version <<<"$manifest")" = "$PACKAGE_VERSION"
          echo "tarball=$tarball" >> "$GITHUB_ENV"
      - name: Existing npm publication verification
        id: registry
        run: |
          state="$(node tools/npm-publication.mjs \
            --candidate "$tarball" --name "$PACKAGE_NAME" --version "$PACKAGE_VERSION")"
          case "$state" in
            missing|published) echo "state=$state" >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac
      - name: npm publication
        if: steps.registry.outputs.state == 'missing'
        run: |
          minimum=11.5.1
          actual="$(npm --version)"
          if [ "$(printf '%s\n%s\n' "$minimum" "$actual" | sort -V | head -n1)" != "$minimum" ]; then
            echo "Trusted Publishing requires npm $minimum or newer: $actual" >&2
            exit 1
          fi
          npm publish "$tarball"
      - name: Published package and provenance verification
        run: |
          for _attempt in {1..12}; do
            state="$(node tools/npm-publication.mjs \
              --candidate "$tarball" --name "$PACKAGE_NAME" --version "$PACKAGE_VERSION")"
            attestations="$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" dist.attestations --json 2>/dev/null || true)"
            attestations="${attestations:-{}}"
            predicate="$(jq -r '.provenance.predicateType // empty' <<<"$attestations")"
            if [ "$state" = published ] && [ "$predicate" = "https://slsa.dev/provenance/v1" ]; then
              echo "Published and verified $PACKAGE_NAME $PACKAGE_VERSION on npm"
              exit 0
            fi
            sleep 5
          done
          echo "npm did not expose the verified package and provenance within 60 seconds" >&2
          exit 1
      - name: Published package smoke from the npm Registry
        run: nix develop .#ci-browser -c node tools/textlint-plugin-npm-smoke.mjs

name: CI and Release

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      product:
        description: Product to publish from this main commit
        required: true
        type: choice
        options:
          - lib
          - cli
          - lsp
          - wasm
          - textlint
          - vscode
          - zed

permissions:
  actions: read
  contents: read

# A silent registry stall must fail within minutes instead of holding the job
# until its timeout. These bounds apply to every npm invocation in this run.
env:
  npm_config_fetch_retries: "3"
  npm_config_fetch_retry_maxtimeout: "30000"
  npm_config_fetch_timeout: "120000"

concurrency:
  group: ci-release-${{ github.event_name }}-${{ github.ref }}-${{ inputs.product || 'source' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Protected main release guard
        if: github.event_name == 'workflow_dispatch'
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2
      - name: Locked toolchain exposure for dependency caching
        run: nix develop .#ci -c bash -c 'command -v cargo' | xargs dirname >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: source
          key: ${{ hashFiles('flake.lock', 'flake.nix', 'nix/**/*.nix') }}
          workspaces: |
            . -> target
            editors/zed -> target
          cache-bin: "false"
          cache-on-failure: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Complete source gate
        run: nix develop .#ci -c cargo make verify

  security:
    name: security-audit
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [source]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2
      - name: Audit distributed dependencies
        run: nix develop .#ci -c cargo make security-audit

  main-integrations:
    name: main-integrations
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [source, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2
      - name: Complete main integrations
        run: nix develop .#ci-integrations -c cargo make main-integrations

  fuzz-smoke:
    name: fuzz-smoke
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [source, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2
      - name: Fuzz known corpus
        run: nix develop .#ci-fuzz -c cargo make fuzz-smoke

  nix-package-check:
    name: nix-package-check
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [source, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2
      - name: Build and verify Nix package
        run: nix flake check

  candidate-plan:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [source, main-integrations, fuzz-smoke, nix-package-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      global_required: ${{ steps.plan.outputs.global_required }}
      native_required: ${{ steps.plan.outputs.native_required }}
      native_matrix: ${{ steps.plan.outputs.native_matrix }}
      native_candidate_matrix: ${{ steps.plan.outputs.native_candidate_matrix }}
      script_matrix: ${{ steps.plan.outputs.script_matrix }}
      product: ${{ steps.plan.outputs.product }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - id: plan
        name: Selected product candidate plan
        run: node tools/product-candidate-plan.mjs "$GITHUB_OUTPUT" "${{ inputs.product }}"

  build-native:
    if: needs.candidate-plan.outputs.native_required == 'true'
    needs: [candidate-plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.candidate-plan.outputs.native_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.build == 'nix'
        uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2
      - name: Locked toolchain exposure for dependency caching
        if: matrix.build == 'nix'
        run: nix develop .#ci -c bash -c 'command -v cargo' | xargs dirname >> "$GITHUB_PATH"
      - if: matrix.build == 'nix'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: native-${{ matrix.product }}-${{ matrix.target }}
          key: ${{ hashFiles('flake.lock') }}
          save-if: true
      - name: Native build linker installation
        if: startsWith(matrix.runner, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - name: Target archive builds
        if: matrix.build == 'nix'
        env:
          MACOSX_DEPLOYMENT_TARGET: '14.0'
          RELEASE_TAG: ${{ matrix.tag }}
        run: >-
          nix develop .#ci -c tools/run-pinned-dist.sh build
          --tag="$RELEASE_TAG"
          --artifacts=local
          --target="${{ matrix.target }}"
          --output-format=json
          > dist-manifest.json
      - name: Darwin archive portability normalization
        if: endsWith(matrix.target, '-apple-darwin')
        run: >-
          tools/normalize-darwin-archives.sh
          target/distrib
          "${{ matrix.product }}"
          "${{ matrix.target }}"
      - name: Fixed Windows Rust and cargo-dist installation
        if: matrix.build == 'windows'
        shell: pwsh
        run: |
          $rustVersion = (Get-Content toolchains.json | ConvertFrom-Json).rustVersion
          $distVersion = (Get-Content release/distribution-plan.json | ConvertFrom-Json).distVersion
          rustup toolchain install $rustVersion --profile minimal --target "${{ matrix.target }}"
          rustup override set $rustVersion
          $distDirectory = Join-Path $env:RUNNER_TEMP "cargo-dist-bin"
          ./tools/install-pinned-cargo-dist.ps1 `
            -DestinationDirectory $distDirectory `
            -DownloadTimeoutSeconds 60 `
            -ExtractionTimeoutSeconds 30
          $distDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          if ((& (Join-Path $distDirectory "dist.exe") --version) -ne "cargo-dist $distVersion") {
            throw "cargo-dist version mismatch"
          }
      - if: matrix.build == 'windows'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: native-${{ matrix.product }}-${{ matrix.target }}
          key: ${{ hashFiles('toolchains.json', 'Cargo.lock', 'crates/adocweave-cli/Cargo.toml', 'crates/adocweave-lsp/Cargo.toml') }}
          save-if: true
      - name: Windows target archive builds
        if: matrix.build == 'windows'
        env:
          RELEASE_TAG: ${{ matrix.tag }}
        shell: pwsh
        run: |
          node tools/generate-third-party-notices.mjs THIRD_PARTY_NOTICES.adoc
          dist build --tag=$env:RELEASE_TAG --artifacts=local --target=${{ matrix.target }} --output-format=json |
            Out-File -Encoding utf8 dist-manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-candidate-${{ matrix.product }}-asset-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 30
          path: target/distrib/adocweave-${{ matrix.product }}-${{ matrix.target }}.zip

  native-smoke:
    if: needs.candidate-plan.outputs.native_required == 'true'
    needs: [candidate-plan, build-native]
    uses: ./.github/workflows/native-artifact-smoke.yml
    with:
      matrix: ${{ needs.candidate-plan.outputs.native_matrix }}

  build-global:
    if: needs.candidate-plan.outputs.global_required == 'true'
    needs: [candidate-plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.candidate-plan.outputs.script_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2
      - name: Complete product candidate build and runtime verification
        env:
          PRODUCT: ${{ matrix.product }}
        run: nix develop .#ci-browser -c cargo make test-global-product-candidate
      - name: Complete candidate metadata generation and verification
        env:
          PRODUCT: ${{ matrix.product }}
        run: |
          node tools/release-metadata.mjs generate "$PRODUCT" target/distrib "$GITHUB_SHA"
          node tools/release-metadata.mjs verify "$PRODUCT" target/distrib "$GITHUB_SHA"
          node tools/product-release.mjs --verify-candidate "$PRODUCT" target/distrib
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-candidate-${{ matrix.product }}
          if-no-files-found: error
          retention-days: 30
          path: target/distrib/*

  finalize-native-candidate:
    if: needs.candidate-plan.outputs.native_required == 'true'
    needs: [candidate-plan, native-smoke]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.candidate-plan.outputs.native_candidate_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-candidate-${{ matrix.product }}-asset-*
          path: artifacts
          merge-multiple: true
      - name: Complete candidate metadata generation and verification
        env:
          PRODUCT: ${{ matrix.product }}
        run: |
          node tools/release-metadata.mjs generate "$PRODUCT" artifacts "$GITHUB_SHA"
          node tools/release-metadata.mjs verify "$PRODUCT" artifacts "$GITHUB_SHA"
          node tools/product-release.mjs --verify-candidate "$PRODUCT" artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-candidate-${{ matrix.product }}-metadata
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/adocweave-dist-manifest.json
            artifacts/sha256.sum

  installation-e2e:
    if: needs.candidate-plan.outputs.native_required == 'true'
    needs: [candidate-plan, finalize-native-candidate]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.candidate-plan.outputs.native_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.nix
        uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-candidate-${{ matrix.product }}-asset-${{ matrix.target }}
          path: artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-candidate-${{ matrix.product }}-metadata
          path: artifacts
      - name: Product installation and complete removal
        run: >-
          node tools/release-installation-e2e.mjs
          "${{ matrix.product }}"
          artifacts
          "${{ matrix.target }}"

  publish-native:
    if: needs.candidate-plan.outputs.native_required == 'true'
    needs: [candidate-plan, installation-e2e]
    uses: ./.github/workflows/release-publish.yml
    with:
      product: ${{ needs.candidate-plan.outputs.product }}
    permissions:
      attestations: write
      contents: write
      id-token: write

  publish-global:
    if: needs.candidate-plan.outputs.global_required == 'true'
    needs: [candidate-plan, build-global]
    uses: ./.github/workflows/release-publish.yml
    with:
      product: ${{ needs.candidate-plan.outputs.product }}
    permissions:
      attestations: write
      contents: write
      id-token: write

  textlint-plugin-post-release-smoke:
    if: needs.candidate-plan.outputs.product == 'textlint'
    needs: [candidate-plan, publish-global]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2
      - name: Published textlint asset, checksum, and one-shot npx observation
        run: nix develop .#ci -c cargo make textlint-plugin-post-release-npx-smoke

  open-vsx:
    if: needs.candidate-plan.outputs.product == 'vscode'
    needs: [candidate-plan, publish-global]
    uses: ./.github/workflows/open-vsx-publish.yml
    with:
      tag: ${{ needs.candidate-plan.outputs.tag }}
    secrets: inherit

  # 一方のregistryへの送信が失敗しても、もう一方を止めない。どちらも公開済みGitHub Releaseを
  # 入力とし、同じtagで単独に再実行できる。
  marketplace:
    if: needs.candidate-plan.outputs.product == 'vscode'
    needs: [candidate-plan, publish-global]
    # 呼び出したworkflowは、top-levelもjobも呼び出し元の権限を超えられない。呼び出し先が
    # 宣言する両方をこのjobから渡す。federationのid-tokenはこの経路だけで、
    # release.ymlのtop-levelへは足さない。
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/marketplace-publish.yml
    with:
      tag: ${{ needs.candidate-plan.outputs.tag }}

  binary-cache:
    if: needs.candidate-plan.outputs.product == 'cli'
    needs: [candidate-plan, publish-native]
    uses: ./.github/workflows/binary-cache-publish.yml
    with:
      tag: ${{ needs.candidate-plan.outputs.tag }}
    secrets: inherit

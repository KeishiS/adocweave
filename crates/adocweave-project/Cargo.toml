[package]
name = "adocweave-project"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Owned request and result contracts for one AdocWeave project run"

[dependencies]
adocweave = { path = "../adocweave" }
adocweave-host = { path = "../adocweave-host" }
glob = "0.3"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
toml = "1.1"

[dev-dependencies]
jsonschema = { version = "0.50", default-features = false }
schemars = "1.2"
serde_json = "1"
tempfile = "3"

[lib]
path = "src/lib.rs"

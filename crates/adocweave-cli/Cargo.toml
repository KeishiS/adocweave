[package]
name = "adocweave-cli"
version = "0.50.0"
edition.workspace = true
license.workspace = true
homepage.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Command-line adapter for AdocWeave"

[dependencies]
adocweave = { path = "../adocweave" }
adocweave-config = { path = "../adocweave-config" }
adocweave-host = { path = "../adocweave-host" }
adocweave-workspace = { path = "../adocweave-workspace" }
clap = { version = "4.5", default-features = false, features = [
  "derive",
  "error-context",
  "help",
  "std",
  "suggestions",
  "usage",
] }
clap_complete = "4.5"
glob = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
similar = "3"
tempfile = "3"
url = "2.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "adocweave"
path = "src/main.rs"
doc = false

[package.metadata.dist]
dist = true

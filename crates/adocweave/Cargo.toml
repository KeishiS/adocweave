[package]
name = "adocweave"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Command-line adapter for AdocWeave"
homepage.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
doc = false
name = "adocweave"
path = "src/main.rs"

[dependencies]
adocweave-core = { path = "../adocweave-core" }
adocweave-lsp = { path = "../adocweave-lsp" }
adocweave-project = { path = "../adocweave-project" }
base64 = "0.22"
clap = { version = "4.5", default-features = false, features = [
  "derive",
  "error-context",
  "help",
  "std",
  "suggestions",
  "usage",
] }
clap_complete = "4.5"
roxmltree = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
similar = "3"
terminal_size = "0.4"
tokio = { version = "1.53.3", features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }
url = "2.5"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading"
] }

[package]
name = "adocweave"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Command-line adapter for AdocWeave"

[dependencies]
adocweave-core = { path = "../adocweave-core" }
adocweave-lsp = { path = "../adocweave-lsp" }
adocweave-project = { path = "../adocweave-project" }
clap = { version = "4.5", default-features = false, features = [
  "derive",
  "error-context",
  "help",
  "std",
  "suggestions",
  "usage",
] }
clap_complete = "4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
similar = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
url = "2.5"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "adocweave"
path = "src/main.rs"
doc = false

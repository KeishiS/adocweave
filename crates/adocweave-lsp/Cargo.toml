[package]
name = "adocweave-lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Language Server for AdocWeave"
homepage.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
adocweave-core = { path = "../adocweave-core" }
adocweave-project = { path = "../adocweave-project" }
async-lsp = { version = "0.2.4", default-features = false, features = [
  "client-monitor",
  "omni-trait",
  "stdio",
  "tokio",
  "tracing",
] }
futures = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.3", features = [
  "io-std",
  "io-util",
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
] }
tokio-util = { version = "0.7", features = ["compat"] }
tower = "0.5"

[dev-dependencies]
tempfile = "3"

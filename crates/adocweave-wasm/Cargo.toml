[package]
name = "adocweave-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "WebAssembly boundary for the @adocweave/wasm npm package"

[dependencies]
adocweave = { path = "../adocweave" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Serdeの入力検証専用属性は、生成するTypeScriptの型を変えません。
# Serde境界と生成宣言の両方は、protocol contract testで検証します。
ts-rs = { version = "12.0.1", default-features = false, features = ["no-serde-warnings", "serde-compat"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "=0.2.121"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "adocweave-conformance-native"
path = "src/bin/conformance-native.rs"

[features]
ts-rs = ["dep:ts-rs"]

[package.metadata.dist]
dist = false

# 外から使うtaskは`fmt`、`fmt-check`、`lint`、`verify`と、`verify`の別名の`default`です。
# これらの名前はMarginalis、Renkanと共通です。
# ほかのtaskはprivateで、それぞれ1つのコマンドを実行します。

[config]
default_to_workspace = false
skip_core_tasks = true

[tasks.default]
alias = "verify"

[tasks.fmt]
description = "Format Rust, TypeScript in the VS Code extension, JSON, Markdown, TOML, YAML, and Nix files"
dependencies = [
  "fmt-workspace",
  "fmt-zed",
  "fmt-biome",
  "fmt-markdown",
  "fmt-toml",
  "fmt-yaml",
  "fmt-nix",
]

[tasks.fmt-check]
description = "Check the formatting of the files that fmt formats without changing them"
dependencies = [
  "fmt-check-workspace",
  "fmt-check-zed",
  "fmt-check-biome",
  "fmt-check-markdown",
  "fmt-check-toml",
  "fmt-check-yaml",
  "fmt-check-nix",
]

[tasks.lint]
description = "Run Clippy with warnings denied, the VS Code extension checks, and the linters for JSON, TypeScript, Markdown, TOML, YAML, and GitHub Actions workflows"
dependencies = [
  "clippy-workspace",
  "clippy-zed",
  "check-vscode",
  "lint-biome",
  "lint-markdown",
  "lint-toml",
  "lint-yaml",
  "lint-workflows",
]

[tasks.verify]
description = "Check formatting, run the linters, and run the Rust, npm package, and VS Code extension tests"
dependencies = [
  "fmt-check",
  "lint",
  "test-workspace",
  "test-zed",
  "protocol-unchanged",
  "test-slides-helper",
  "test-wasm",
  "test-textlint-plugin-asciidoc",
  "test-vscode",
]

[tasks.fmt-workspace]
private = true
command = "cargo"
args = ["fmt", "--all"]

[tasks.fmt-zed]
private = true
command = "cargo"
args = ["fmt", "--manifest-path", "editors/zed/Cargo.toml"]

# Biomeは、JSONとVS Code拡張のTypeScriptを扱います。対象はrootの`biome.json`で定めます。
[tasks.fmt-biome]
private = true
command = "biome"
args = ["format", "--write"]

[tasks.fmt-markdown]
private = true
command = "rumdl"
args = ["fmt"]

[tasks.fmt-toml]
private = true
command = "tombi"
args = ["format"]

# YAMLのファイルは、`.github`の下と、yamllintの設定の`.yamllint.yaml`だけです。
# YAMLのファイルを別の場所へ加える場合は、`fmt-check-yaml`と`lint-yaml`の引数にも同じ変更で加えます。
# 利用者ごとのyamlfmtの設定は読みません。空行は残し、続いた空行は1行にまとめます。
[tasks.fmt-yaml]
private = true
command = "yamlfmt"
args = [
  "-no_global_conf",
  "-formatter",
  "retain_line_breaks_single=true",
  ".github",
  ".yamllint.yaml",
]

# nixfmtへディレクトリを渡す使い方は非推奨のため、対象のファイルを引数で指定します。
# Nixのファイルを増やす場合は、`fmt-check-nix`の引数にも同じ変更で加えます。
[tasks.fmt-nix]
private = true
command = "nixfmt"
args = ["flake.nix"]

[tasks.fmt-check-workspace]
private = true
command = "cargo"
args = ["fmt", "--all", "--check"]

[tasks.fmt-check-zed]
private = true
command = "cargo"
args = ["fmt", "--manifest-path", "editors/zed/Cargo.toml", "--check"]

[tasks.fmt-check-biome]
private = true
command = "biome"
args = ["format"]

[tasks.fmt-check-markdown]
private = true
command = "rumdl"
args = ["fmt", "--check"]

[tasks.fmt-check-toml]
private = true
command = "tombi"
args = ["format", "--check"]

[tasks.fmt-check-yaml]
private = true
command = "yamlfmt"
args = [
  "-no_global_conf",
  "-formatter",
  "retain_line_breaks_single=true",
  "-lint",
  ".github",
  ".yamllint.yaml",
]

[tasks.fmt-check-nix]
private = true
command = "nixfmt"
args = ["--check", "flake.nix"]

[tasks.clippy-workspace]
private = true
command = "cargo"
args = [
  "clippy",
  "--workspace",
  "--all-targets",
  "--all-features",
  "--locked",
  "--",
  "-D",
  "warnings",
]

[tasks.clippy-zed]
private = true
command = "cargo"
args = [
  "clippy",
  "--manifest-path",
  "editors/zed/Cargo.toml",
  "--all-targets",
  "--locked",
  "--",
  "-D",
  "warnings",
]

[tasks.install-vscode]
private = true
command = "npm"
args = ["ci", "--ignore-scripts", "--no-audit", "--no-fund", "--prefix", "editors/vscode"]

# `check` scriptは、型検査と、manifestと構文強調の定義の検証を行います。lintは`lint-biome`が行います。
[tasks.check-vscode]
private = true
dependencies = ["install-vscode"]
command = "npm"
args = ["run", "check", "--prefix", "editors/vscode"]

[tasks.lint-biome]
private = true
command = "biome"
args = ["lint", "--error-on-warnings"]

[tasks.lint-markdown]
private = true
command = "rumdl"
args = ["check"]

[tasks.lint-toml]
private = true
command = "tombi"
args = ["lint", "--error-on-warnings"]

[tasks.lint-yaml]
private = true
command = "yamllint"
args = ["--strict", ".github", ".yamllint.yaml"]

# release.ymlはcargo-distが生成します。生成部分と公開workflowに残るshellcheckの指摘のうち、
# 引用符の省略(SC2086)と、同じファイルへの個別の追記(SC2129)は報告しません。
[tasks.lint-workflows]
private = true
command = "actionlint"
args = ["-ignore", "SC2086", "-ignore", "SC2129"]

# スライドのCLI試験は実際のNode補助を起動し、補助パッケージ自身のテストも依存関係を使うため、テストの前に導入します。
[tasks.install-slides-helper]
private = true
command = "npm"
args = ["ci", "--ignore-scripts", "--no-audit", "--no-fund", "--prefix", "packages/slides-helper"]

[tasks.test-workspace]
private = true
dependencies = ["install-slides-helper"]
command = "cargo"
args = ["test", "--workspace", "--all-features", "--locked"]

[tasks.test-zed]
private = true
command = "cargo"
args = ["test", "--manifest-path", "editors/zed/Cargo.toml", "--locked"]

# `--all-features`のテストは、Rustの型から`packages/wasm/protocol.d.mts`を生成し直します。
# commitした型宣言がRustの型と食い違っている場合は、indexとの差分として検出して失敗させます。
[tasks.protocol-unchanged]
private = true
dependencies = ["test-workspace"]
command = "git"
args = ["diff", "--exit-code", "--", "packages/wasm/protocol.d.mts"]

[tasks.test-slides-helper]
private = true
dependencies = ["install-slides-helper"]
command = "npm"
args = ["test", "--prefix", "packages/slides-helper"]

[tasks.test-wasm]
private = true
command = "npm"
args = ["test", "--prefix", "packages/wasm"]

[tasks.test-textlint-plugin-asciidoc]
private = true
command = "npm"
args = ["test", "--prefix", "packages/textlint-plugin-asciidoc"]

[tasks.test-vscode]
private = true
dependencies = ["install-vscode"]
command = "npm"
args = ["test", "--prefix", "editors/vscode"]

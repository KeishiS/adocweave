[config]
default_to_workspace = false
skip_core_tasks = true

[tasks.default]
alias = "verify"

[tasks.fmt-workspace]
private = true
description = "Format workspace Rust source files"
command = "cargo"
args = ["fmt", "--all"]

[tasks.fmt-zed]
private = true
description = "Format the excluded Zed extension crate"
command = "cargo"
args = ["fmt", "--manifest-path", "editors/zed/Cargo.toml"]

[tasks.fmt]
category = "Developer entry points"
description = "Format workspace and Zed extension Rust source files"
dependencies = ["fmt-workspace", "fmt-zed"]

[tasks.fmt-check-workspace]
private = true
description = "Check workspace Rust formatting without changing files"
command = "cargo"
args = ["fmt", "--all", "--", "--check"]

[tasks.fmt-check-zed]
private = true
description = "Check Zed extension formatting without changing files"
command = "cargo"
args = [
  "fmt",
  "--manifest-path",
  "editors/zed/Cargo.toml",
  "--",
  "--check",
]

[tasks.fmt-check]
category = "Developer entry points"
description = "Check all Rust formatting without changing files"
dependencies = ["fmt-check-workspace", "fmt-check-zed"]

[tasks.clippy]
private = true
description = "Run Clippy for all workspace targets and features"
command = "cargo"
args = [
  "clippy",
  "--workspace",
  "--all-targets",
  "--all-features",
  "--",
  "-D",
  "warnings",
]

[tasks.test]
private = true
description = "Run all workspace tests and require generated declarations and schemas to stay unchanged"
script_runner = "@shell"
script = '''
# ts-rsは既存fileへ追記するため、消えた型が残らないようworkspace testの前に作り直します。
rm -f packages/wasm/protocol.d.mts
cargo test --workspace --all-features
git diff --exit-code -- packages/wasm/protocol.d.mts
'''

[tasks.test-wasm-package]
private = true
description = "Run the WebAssembly npm package tests"
command = "npm"
args = ["test", "--prefix", "packages/wasm"]

[tasks.protocol-wasm-corpus-check]
private = true
description = "Verify the request corpus through the generated wasm-bindgen boundary"
dependencies = ["build-wasm-node"]
command = "node"
args = ["--test", "packages/wasm/protocol-wasm.test.mjs"]

[tasks.native-release-checks]
category = "CI entry points"
description = "Verify the native version, release tag, cargo-dist artifacts, and Cargo metadata"
dependencies = ["native-version-check"]
script_runner = "@shell"
script = '''
node --test \
  tools/generate-third-party-notices.test.mjs \
  tools/native-release-acceptance.test.mjs \
  tools/native-release-checks.test.mjs \
  tools/verify-vscode-dependencies.test.mjs
metadata="$(mktemp "${TMPDIR:-/tmp}/adocweave-release-metadata.XXXXXX.json")"
notice="$(mktemp "${TMPDIR:-/tmp}/adocweave-third-party-notices.XXXXXX.adoc")"
trap 'rm -f "$metadata" "$notice"' EXIT
if [ -n "${RELEASE_TAG:-}" ]; then
  node tools/native-release-checks.mjs "--tag=$RELEASE_TAG"
else
  node tools/native-release-checks.mjs
fi
cargo metadata --locked --format-version=1 > "$metadata"
node tools/verify-cargo-release-metadata.mjs "$metadata"
node tools/generate-third-party-notices.mjs "$notice"
'''

[tasks.native-release-acceptance]
category = "Developer entry points"
description = "Verify a published native GitHub Release, attestations, and installation on this host"
script_runner = "@shell"
script = '''
if [ -z "${RELEASE_TAG:-}" ]; then
  echo "RELEASE_TAG is required (for example, v0.54.1)" >&2
  exit 2
fi
node tools/native-release-checks.mjs "--tag=$RELEASE_TAG"
scratch="$(mktemp -d "${TMPDIR:-/tmp}/adocweave-native-release.XXXXXX")"
trap 'rm -rf "$scratch"' EXIT
assets="$scratch/assets"
mkdir "$assets"
repository="$(gh repo view --json nameWithOwner --jq .nameWithOwner)"
gh api "repos/$repository/releases/tags/$RELEASE_TAG" > "$scratch/release.json"
gh release download "$RELEASE_TAG" --repo "$repository" --dir "$assets"
node tools/native-release-acceptance.mjs "$RELEASE_TAG" "$scratch/release.json" "$assets"
for asset in "$assets"/*; do
  gh attestation verify "$asset" --repo "$repository"
done
node tools/native-release-installation.mjs "$assets" "$assets/dist-manifest.json"
'''

[tasks.native-version-check]
private = true
description = "Verify the native workspace, lockfiles, and changelog version"
script_runner = "@shell"
script = '''
node --test tools/native-release-version.test.mjs
node tools/native-release-version.mjs --check
'''

[tasks.security-audit]
category = "Developer entry points"
description = "Audit distributed dependency licenses, sources, and current advisories"
command = "bash"
args = ["tools/security-audit.sh"]

[tasks.release-tool-tests]
private = true
description = "Test the scripts that build, publish, and observe the distribution artifacts"
script_runner = "@shell"
script = '''
node --test \
  tools/cachix-smoke.test.mjs \
  tools/wasm-release-budget.test.mjs \
  tools/npm-publication.test.mjs \
  tools/open-vsx-publication.test.mjs
'''

[tasks.workflow-lint]
private = true
description = "Lint GitHub Actions syntax and audit workflow security"
script_runner = "@shell"
script = '''
actionlint \
  -ignore 'unknown permission scope "vulnerability-alerts"' \
  -ignore SC2086 \
  -ignore SC2129
# 除外した箇所と理由は.github/zizmor.ymlにあります。medium未満は確度が低く、現在は
# 成果物のsha256を比較する式だけが該当するため、失敗の条件をmedium以上にします。
zizmor --offline --no-progress --min-severity medium .github/workflows
'''

[tasks.native-release-ci]
private = true
description = "Run the native release checks, workflow lint, tool tests, and cargo-dist plan used by pull requests"
dependencies = [
  "native-release-checks",
  "workflow-lint",
  "release-tool-tests",
  "dist-plan",
]

[tasks.native-platform-contract]
private = true
description = "Verify native archive and operating-system contracts without requiring each target host"
command = "node"
args = [
  "--test",
  "tools/native-platform.test.mjs",
]

[tasks.npm-package-contracts]
private = true
description = "Verify WebAssembly and textlint package installation contracts"
command = "node"
args = [
  "--test",
  "tools/wasm-npm-smoke.test.mjs",
  "tools/textlint-plugin-npm-smoke.test.mjs",
  "tools/textlint-plugin-npx-smoke.test.mjs",
  "tools/textlint-plugin-consumer-e2e.test.mjs",
  "tools/verify-textlint-plugin-reproducibility.test.mjs",
]

[tasks.check-windows-target]
private = true
description = "Type-check native crates for the supported Windows target without linking"
command = "cargo"
args = [
  "check",
  "--workspace",
  "--all-features",
  "--target",
  "x86_64-pc-windows-msvc",
]

[tasks.check-macos-target]
private = true
description = "Type-check native crates for the supported macOS target without linking"
command = "cargo"
args = [
  "check",
  "--workspace",
  "--all-features",
  "--target",
  "aarch64-apple-darwin",
]

[tasks.cross-native-check]
private = true
description = "Type-check supported Windows and macOS targets without linking or executing"
dependencies = ["check-windows-target", "check-macos-target"]

[tasks.dist-plan]
private = true
description = "Run the pinned cargo-dist plan for the native release"
script_runner = "@shell"
script = '''
node tools/generate-third-party-notices.mjs THIRD_PARTY_NOTICES.adoc
root="$(mktemp -d "${TMPDIR:-/tmp}/adocweave-dist-plan.XXXXXX")"
trap 'rm -rf "$root"' EXIT
version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)"
tag="v$version"
plan="$root/plan.json"
dist plan --tag="$tag" --output-format=json > "$plan"
node tools/verify-dist-plan.mjs "$plan" "$tag"
'''

[tasks.compile-wasm-release]
private = true
description = "Compile the shared WebAssembly module once for web and Node.js bindings"
script_runner = "@shell"
script = '''
export RUSTFLAGS="${RUSTFLAGS:-} --remap-path-prefix=$(pwd)=. --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=cargo-home"
cargo build -p adocweave-wasm --release --target wasm32-unknown-unknown
'''

[tasks.build-wasm]
private = true
description = "Build wasm-bindgen web artifacts with the fast release profile for local iteration"
dependencies = ["compile-wasm-release"]
script_runner = "@shell"
script = '''
wasm-bindgen \
  --target web \
  --out-dir target/adocweave-wasm-dev \
  target/wasm32-unknown-unknown/release/adocweave_wasm.wasm
'''

[tasks.package-wasm-release]
private = true

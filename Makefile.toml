args = ["--project", "web-worker/tsconfig.json"]

[tasks.test-browser-smoke]
private = true
description = "Run the extracted browser archive in a non-isolated Chromium context"
dependencies = ["package-browser-release", "test-browser-types"]
script_runner = "@shell"
script = '''
node --test tools/process-lifecycle.test.mjs tools/host-executable.test.mjs
version="$(node --input-type=module -e "import manifest from './web-worker/package.json' with { type: 'json' }; process.stdout.write(manifest.version)")"
node tools/browser-release-smoke.mjs "target/distrib/adocweave-browser-$version.tar.xz" "${ADOCWEAVE_BROWSER:-chromium}"
'''

[tasks.test-browser-bundler]
private = true
description = "Bundle the public browser API with esbuild and smoke test its asset URL resolution"
dependencies = ["package-browser-release", "test-browser-types"]
command = "bash"
args = ["tools/browser-bundler-smoke.sh"]

[tasks.release-global-candidate]
private = true
description = "Build and completely verify each global release candidate"
dependencies = [
  "test-browser-release-candidate",
  "textlint-plugin-release-consumer-e2e",
  "test-vscode-release-determinism",
  "test-zed-release-candidate",
]

[tasks.test-global-product-candidate]
category = "CI entry points"
description = "Build and completely verify PRODUCT as one global release candidate"
script_runner = "@shell"
script = '''
case "${PRODUCT:-}" in
  browser) task=test-browser-release-candidate ;;
  textlint) task=textlint-plugin-release-consumer-e2e ;;
  vscode) task=test-vscode-release-determinism ;;
  zed) task=test-zed-release-candidate ;;
  *) echo "unsupported global candidate product: ${PRODUCT:-<unset>}" >&2; exit 2 ;;
esac
cargo make "$task"
'''

[tasks.browser-runtime-check]

script = '''
unexpected="$(rg --files --hidden -g '*.md' -g '!.git/**' | rg -v '^(AGENTS\.md|CHANGELOG\.md|\.claude/skills/[^/]+/SKILL\.md|\.github/pull_request_template\.md|\.github/SECURITY\.md|editors/(vscode|zed)/(README|CHANGELOG)\.md|packages/[^/]+/(README|CHANGELOG)\.md)$' || true)"
if [ -n "$unexpected" ]; then
  echo "repository documentation must use .adoc except repository metadata:" >&2
  echo "$unexpected" >&2

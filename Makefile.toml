[config]
default_to_workspace = false
skip_core_tasks = true

[tasks.default]
alias = "verify"

[tasks.fmt-workspace]
private = true
description = "Format workspace Rust source files"
command = "cargo"
args = ["fmt", "--all"]

[tasks.fmt-zed]
private = true
description = "Format the excluded Zed extension crate"
command = "cargo"
args = ["fmt", "--manifest-path", "editors/zed/Cargo.toml"]

[tasks.fmt]
category = "Developer entry points"
description = "Format workspace and Zed extension Rust source files"
dependencies = ["fmt-workspace", "fmt-zed"]

[tasks.fmt-check-workspace]
private = true
description = "Check workspace Rust formatting without changing files"
command = "cargo"
args = ["fmt", "--all", "--", "--check"]

[tasks.fmt-check-zed]
private = true
description = "Check Zed extension formatting without changing files"
command = "cargo"
args = [
  "fmt",
  "--manifest-path",
  "editors/zed/Cargo.toml",
  "--",
  "--check",
]

[tasks.fmt-check]
category = "Developer entry points"
description = "Check all Rust formatting without changing files"
dependencies = ["fmt-check-workspace", "fmt-check-zed"]

[tasks.clippy]
private = true
description = "Run Clippy for all workspace targets and features"
command = "cargo"
args = [
  "clippy",
  "--workspace",
  "--all-targets",
  "--all-features",
  "--",
  "-D",
  "warnings",
]

[tasks.test]
private = true
description = "Run all workspace tests and require generated declarations and schemas to stay unchanged"
script_runner = "@shell"
script = '''
# ts-rsは既存fileへ追記するため、消えた型が残らないようworkspace testの前に作り直します。
rm -f web-worker/protocol.d.mts
cargo test --workspace --all-features
git diff --exit-code -- web-worker/protocol.d.mts
'''

[tasks.test-web-worker]
private = true
description = "Run the Web Worker protocol tests"
command = "npm"
args = ["test", "--prefix", "web-worker"]

[tasks.protocol-wasm-corpus-check]
private = true
description = "Verify the request corpus through the generated wasm-bindgen boundary"
dependencies = ["build-wasm-node"]
command = "node"
args = ["--test", "web-worker/protocol-wasm.test.mjs"]

[tasks.release-contract]
private = true
description = "Verify release train versions, targets, tags, and distribution manifest schema"
dependencies = [
  "release-version-check",
  "release-workflow-policy",
]
script_runner = "@shell"
script = '''
node --test \
  tools/generate-third-party-notices.test.mjs \
  tools/release-metadata.test.mjs \
  tools/release-notes.test.mjs \
  tools/verify-vscode-dependencies.test.mjs
node tools/release-notes.mjs --check
args=""
metadata="$(mktemp "${TMPDIR:-/tmp}/adocweave-release-metadata.XXXXXX.json")"
zed_metadata="$(mktemp "${TMPDIR:-/tmp}/adocweave-zed-release-metadata.XXXXXX.json")"
notice="$(mktemp "${TMPDIR:-/tmp}/adocweave-third-party-notices.XXXXXX.adoc")"
trap 'rm -f "$metadata" "$zed_metadata" "$notice"' EXIT
if [ -n "${RELEASE_TAG:-}" ]; then
  args="--tag=$RELEASE_TAG"
fi
node tools/release-contract.mjs $args
node tools/release-contract.test.mjs
cargo metadata --locked --format-version=1 > "$metadata"
cargo metadata --manifest-path editors/zed/Cargo.toml --locked --format-version=1 > "$zed_metadata"
node tools/verify-cargo-release-metadata.mjs "$metadata" "$zed_metadata"
node tools/generate-third-party-notices.mjs "$notice"
'''

[tasks.release-version-check]
private = true
description = "Verify the explicit release version allowlist and generated outputs"
script_runner = "@shell"
script = '''
node --test tools/sync-release-version.test.mjs
node tools/sync-release-version.mjs --check
'''

[tasks.security-audit]
category = "Developer entry points"
description = "Audit distributed dependency licenses, sources, and current advisories"
command = "bash"
args = ["tools/security-audit.sh"]

[tasks.release-workflow-policy]
private = true
description = "Verify action pins, permissions, secret access, and product release routing"
script_runner = "@shell"
script = '''
node tools/release-workflow-policy.mjs
node --test \
  tools/browser-release-budget.test.mjs \
  tools/normalize-darwin-archives.test.mjs \
  tools/npm-package-asset.test.mjs \
  tools/product-candidate-plan.test.mjs \
  tools/product-release.test.mjs \
  tools/release-workflow-policy.test.mjs \
  tools/security-audit.test.mjs
'''

[tasks.workflow-lint]
private = true
description = "Lint GitHub Actions syntax and enforce the release security policy"
dependencies = ["release-workflow-policy"]
command = "actionlint"
args = [
  "-ignore",
  'unknown permission scope "vulnerability-alerts"',
]

[tasks.release-ci-contract]
private = true
description = "Run the release contract, workflow lint, and cargo-dist plan used by pull requests"
dependencies = ["release-contract", "workflow-lint", "dist-plan"]

[tasks.platform-contract]
private = true
description = "Verify Windows and macOS release contracts without requiring the target operating system"
command = "node"
args = [
  "--test",
  "tools/platform-contract.test.mjs",
  "tools/release-installation-e2e.test.mjs",
  "tools/textlint-plugin-npx-smoke.test.mjs",
  "tools/textlint-plugin-post-release-smoke.test.mjs",
  "tools/textlint-plugin-consumer-e2e.test.mjs",
  "tools/verify-textlint-plugin-reproducibility.test.mjs",
]

[tasks.check-windows-target]
private = true
description = "Type-check native crates for the supported Windows target without linking"
command = "cargo"
args = [
  "check",
  "--workspace",
  "--all-features",
  "--target",
  "x86_64-pc-windows-msvc",
]

[tasks.check-macos-target]
private = true
description = "Type-check native crates for the supported macOS target without linking"
command = "cargo"
args = [
  "check",
  "--workspace",
  "--all-features",
  "--target",
  "aarch64-apple-darwin",
]

[tasks.cross-native-check]
private = true
description = "Type-check supported Windows and macOS targets without linking or executing"
dependencies = ["check-windows-target", "check-macos-target"]

[tasks.dist-plan]
private = true
description = "Run each pinned native product dist plan without publishing"
script_runner = "@shell"
script = '''
node tools/generate-third-party-notices.mjs THIRD_PARTY_NOTICES.adoc
root="$(mktemp -d "${TMPDIR:-/tmp}/adocweave-dist-plan.XXXXXX")"
trap 'rm -rf "$root"' EXIT
for product in cli lsp; do
  tag="$(node tools/product-release.mjs "$product" | jq -r .tag)"
  plan="$root/$product.json"
  dist plan --tag="$tag" --output-format=json > "$plan"
  node tools/verify-dist-plan.mjs "$plan" "$tag"
done
'''

[tasks.compile-wasm-release]
private = true
description = "Compile the shared WebAssembly module once for web and Node.js bindings"
script_runner = "@shell"
script = '''
export RUSTFLAGS="${RUSTFLAGS:-} --remap-path-prefix=$(pwd)=. --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=cargo-home"
cargo build -p adocweave-wasm --release --target wasm32-unknown-unknown
'''

[tasks.build-wasm]
private = true
description = "Build wasm-bindgen web artifacts with the fast release profile for local iteration"
dependencies = ["compile-wasm-release"]
script_runner = "@shell"
script = '''
wasm-bindgen \
  --target web \
  --out-dir target/adocweave-wasm-dev \
  target/wasm32-unknown-unknown/release/adocweave_wasm.wasm
'''

[tasks.package-browser-release]
private = true
description = "Build the deterministic browser extra artifact consumed by dist"
command = "bash"
args = ["tools/package-browser-release.sh"]

[tasks.package-zed-release]
private = true
description = "Build the deterministic source-checkout-free Zed development extension archive"
command = "bash"
args = ["tools/package-zed-release.sh"]

[tasks.package-textlint-plugin-release]
private = true
description = "Build the deterministic npm-compatible textlint plugin archive"
command = "bash"
args = ["tools/package-textlint-plugin-release.sh"]

[tasks.verify-textlint-plugin-release-package]
private = true
description = "Verify the completed textlint plugin archive once against package.json"
dependencies = [
  "package-textlint-plugin-release",
]
script_runner = "@shell"
script = '''
node --test packages/textlint-plugin-asciidoc/package-archive.test.mjs
version="$(node --input-type=module -e "import manifest from './packages/textlint-plugin-asciidoc/package.json' with { type: 'json' }; process.stdout.write(manifest.version)")"
node tools/verify-textlint-plugin-package.mjs \
  "target/distrib/adocweave-textlint-plugin-asciidoc-$version.tgz"
'''

[tasks.textlint-plugin-reproducibility]
private = true
description = "Compare the verified textlint candidate with one clean rebuild"
dependencies = ["verify-textlint-plugin-release-package"]
script_runner = "@shell"
script = '''
version="$(node --input-type=module -e "import manifest from './packages/textlint-plugin-asciidoc/package.json' with { type: 'json' }; process.stdout.write(manifest.version)")"
node tools/verify-textlint-plugin-reproducibility.mjs \
  "target/distrib/adocweave-textlint-plugin-asciidoc-$version.tgz"
'''

[tasks.textlint-plugin-release-consumer-e2e]
category = "CI entry points"
description = "Install the candidate archive into the fixed consumer and exercise the public CLI"
dependencies = ["verify-textlint-plugin-release-package"]
script_runner = "@shell"
script = '''
version="$(node --input-type=module -e "import manifest from './packages/textlint-plugin-asciidoc/package.json' with { type: 'json' }; process.stdout.write(manifest.version)")"
node tools/textlint-plugin-consumer-e2e.mjs \
  "target/distrib/adocweave-textlint-plugin-asciidoc-$version.tgz"
'''

[tasks.textlint-plugin-post-release-npx-smoke]
category = "CI entry points"
description = "Observe the published GitHub Release asset, checksum, and one-shot npx path after publication"
command = "node"
args = ["tools/textlint-plugin-post-release-smoke.mjs"]

[tasks.test-zed-release-package]
private = true
description = "Verify the Zed release archive layout and deterministic bytes"
dependencies = ["package-zed-release"]

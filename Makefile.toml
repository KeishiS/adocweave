# 3製品(AdocWeave、Marginalis、Renkan)で共通の外向きtask名。fmt、fmt-check、verify、security-audit、
# acceptanceおよびrelease-checkを同じ意味で使い、既定taskはverifyとします。

[tasks.acceptance]
category = "Developer entry points"
description = "Run main integrations and candidate acceptance suites available on the current host"
dependencies = [
  "main-gate",
  "release-global-candidate",
]

[tasks.release-check]
category = "Developer entry points"
description = "Run the main gate, build publishable candidates, and report release WASM artifact sizes"
dependencies = [
  "verify",
  "security-audit",
  "acceptance",
  "wasm-size",
  "dist-plan",
]

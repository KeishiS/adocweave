  "test-vscode-acquisition",
  "textlint-plugin-wasm-contract",
  "textlint-plugin-browser-isolation",
]

[tasks.main-gate]
category = "CI entry points"
description = "Run the expensive main-only integrations in addition to a separately completed source gate"
dependencies = [
  "fuzz-smoke",
  "main-integrations",
  "nix-package-check",
]

[tasks.release-candidates]
private = true
description = "Build and verify every independently versioned package candidate"
dependencies = [
  "test-wasm-release-candidate",
  "test-textlint-plugin-release-candidate",
  "test-vscode-release-candidate",
]

# 3製品(AdocWeave、Marginalis、Renkan)で共通の外向きtask名。fmt、fmt-check、verify、security-audit、
# acceptanceおよびrelease-checkを同じ意味で使い、既定taskはverifyとします。

[tasks.acceptance]
category = "Developer entry points"
description = "Run main integrations and candidate acceptance suites available on the current host"
dependencies = [
  "main-gate",
  "release-candidates",
]

[tasks.release-check]
category = "Developer entry points"
description = "Run the main gate and build publishable candidates"
dependencies = [
  "verify",
  "security-audit",
  "acceptance",
  "dist-plan",
]

# 外から使うtaskは`fmt`、`fmt-check`、`verify`と、`verify`の別名の`default`です。
# これらの名前はMarginalis、Renkanと共通です。
# ほかのtaskはprivateで、それぞれ1つのコマンドを実行します。

[config]
default_to_workspace = false
skip_core_tasks = true

[tasks.default]
alias = "verify"

[tasks.fmt]
description = "Format Rust sources in the workspace and the Zed extension and TypeScript sources in the VS Code extension"
dependencies = ["fmt-workspace", "fmt-zed", "fmt-vscode"]

[tasks.fmt-check]
description = "Check Rust formatting in the workspace and the Zed extension and TypeScript formatting in the VS Code extension without changing files"
dependencies = ["fmt-check-workspace", "fmt-check-zed", "fmt-check-vscode"]

[tasks.verify]
description = "Check formatting, run Clippy with warnings denied, run the VS Code extension checks, and run the Rust, npm package, and VS Code extension tests"
dependencies = [
  "fmt-check",
  "clippy-workspace",
  "clippy-zed",
  "check-vscode",
  "test-workspace",
  "test-zed",
  "protocol-unchanged",
  "test-slides-helper",
  "test-wasm",
  "test-textlint-plugin-asciidoc",
  "test-vscode",
]

[tasks.fmt-workspace]
private = true
command = "cargo"
args = ["fmt", "--all"]

[tasks.fmt-zed]
private = true
command = "cargo"
args = ["fmt", "--manifest-path", "editors/zed/Cargo.toml"]

[tasks.install-vscode]
private = true
command = "npm"
args = ["ci", "--ignore-scripts", "--no-audit", "--no-fund", "--prefix", "editors/vscode"]

[tasks.fmt-vscode]
private = true
dependencies = ["install-vscode"]
command = "npm"
args = ["run", "format", "--prefix", "editors/vscode"]

[tasks.fmt-check-workspace]
private = true
command = "cargo"
args = ["fmt", "--all", "--check"]

[tasks.fmt-check-zed]
private = true
command = "cargo"
args = ["fmt", "--manifest-path", "editors/zed/Cargo.toml", "--check"]

[tasks.fmt-check-vscode]
private = true
dependencies = ["install-vscode"]
command = "npm"
args = ["run", "format:check", "--prefix", "editors/vscode"]

[tasks.clippy-workspace]
private = true
command = "cargo"
args = ["clippy", "--workspace", "--all-targets", "--all-features", "--locked", "--", "-D", "warnings"]

[tasks.clippy-zed]
private = true
command = "cargo"
args = ["clippy", "--manifest-path", "editors/zed/Cargo.toml", "--all-targets", "--locked", "--", "-D", "warnings"]

# `check` scriptは整形を検査しません。VS Code拡張の整形の検査は`fmt-check-vscode`だけが行います。
[tasks.check-vscode]
private = true
dependencies = ["install-vscode"]
command = "npm"
args = ["run", "check", "--prefix", "editors/vscode"]

# スライドのCLI試験は実際のNode補助を起動し、補助パッケージ自身のテストも依存関係を使うため、テストの前に導入します。
[tasks.install-slides-helper]
private = true
command = "npm"
args = ["ci", "--ignore-scripts", "--no-audit", "--no-fund", "--prefix", "packages/slides-helper"]

[tasks.test-workspace]
private = true
dependencies = ["install-slides-helper"]
command = "cargo"
args = ["test", "--workspace", "--all-features", "--locked"]

[tasks.test-zed]
private = true
command = "cargo"
args = ["test", "--manifest-path", "editors/zed/Cargo.toml", "--locked"]

# `--all-features`のテストは、Rustの型から`packages/wasm/protocol.d.mts`を生成し直します。
# commitした型宣言がRustの型と食い違っている場合は、indexとの差分として検出して失敗させます。
[tasks.protocol-unchanged]
private = true
dependencies = ["test-workspace"]
command = "git"
args = ["diff", "--exit-code", "--", "packages/wasm/protocol.d.mts"]

[tasks.test-slides-helper]
private = true
dependencies = ["install-slides-helper"]
command = "npm"
args = ["test", "--prefix", "packages/slides-helper"]

[tasks.test-wasm]
private = true
command = "npm"
args = ["test", "--prefix", "packages/wasm"]

[tasks.test-textlint-plugin-asciidoc]
private = true
command = "npm"
args = ["test", "--prefix", "packages/textlint-plugin-asciidoc"]

[tasks.test-vscode]
private = true
dependencies = ["install-vscode"]
command = "npm"
args = ["test", "--prefix", "editors/vscode"]

[package]
name = "adocweave-zed"
version = "0.53.0"
edition = "2021"
license = "MIT"
publish = false
repository = "https://github.com/KeishiS/adocweave"
rust-version = "1.97.1"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zed_extension_api = "0.7.0"
